            </div>

            <div class="flex items-center">
                <nav class="hidden md:flex gap-gutter items-center">

            </div>
        </div>

    <!-- Main Content Canvas -->
    <main class="flex-grow py-12 md:py-section-gap px-4 md:px-margin-desktop w-full">
        <div class="max-w-[720px] mx-auto">
            <!-- Header Section -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-tertiary-fixed mb-4">
                    <span class="material-symbols-outlined text-on-tertiary-fixed-variant"
                        style="font-variation-settings: 'FILL' 1;">task_alt</span>
                </div>
                <h1 class="font-display-lg text-display-lg text-on-surface mb-stack-sm tracking-tight">Please review
                    your details</h1>
                <p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">We found this information
                    in your document. Please check that everything is correct.</p>
            </div>
            <!-- Form Card -->
            <div
                class="bg-surface-container-lowest rounded-xl p-6 md:p-10 bloom-shadow border border-outline-variant/30">
                <div class="flex justify-end mb-6"><button
                        class="inline-flex items-center gap-2 text-primary font-label-md text-label-md hover:text-primary/80 transition-colors"><span
                            class="material-symbols-outlined text-[20px]">edit</span>Edit Details</button></div>
                <form>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
                        <!-- Full Name -->
                        <div class="col-span-1 md:col-span-2">
                            <label class="block font-label-md text-label-md text-on-surface mb-unit" for="fullName">Full
                                Name</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-4 top-3 text-outline">person</span>
                                <input
                                    class="w-full input-recessed border border-transparent rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
                                    id="fullName" type="text" value="Priya Sharma">
                            </div>
                        </div>
                        <!-- Date of Birth -->
                        <div class="col-span-1">
                            <label class="block font-label-md text-label-md text-on-surface mb-unit" for="dob">Date of
                                Birth</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-3 text-outline">calendar_month</span>
                                <input
                                    class="w-full input-recessed border border-transparent rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
                                    id="dob" type="text" value="14/08/1985">
                            </div>
                        </div>
                        <!-- State -->
                        <div class="col-span-1">
                            <label class="block font-label-md text-label-md text-on-surface mb-unit"
                                for="state">State</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-4 top-3 text-outline">map</span>
                                <input
                                    class="w-full input-recessed border border-transparent rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
                                    id="state" type="text" value="Delhi">
                            </div>
                        </div>
                        <!-- Address -->
                        <div class="col-span-1 md:col-span-2">
                            <label class="block font-label-md text-label-md text-on-surface mb-unit"
                                for="address">Address</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-4 top-3 text-outline">home</span>
                                <input
                                    class="w-full input-recessed border border-transparent rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
                                    id="address" type="text" value="Block C, Green Park Extension, New Delhi">
                            </div>
                        </div>
                        <!-- Annual Income -->
                        <div class="col-span-1">
                            <label class="block font-label-md text-label-md text-on-surface mb-unit" for="income">Annual
                                Income</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-4 top-3 text-outline">payments</span>
                                <input
                                    class="w-full input-recessed border border-transparent rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
                                    id="income" type="text" value="₹ 8,50,000">
                            </div>
                        </div>
                        <!-- Occupation -->
                        <div class="col-span-1">
                            <label class="block font-label-md text-label-md text-on-surface mb-unit"
                                for="occupation">Occupation</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-4 top-3 text-outline">work</span>
                                <input
                                    class="w-full input-recessed border border-transparent rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"
                                    id="occupation" type="text" value="Senior Teacher">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <!-- Action Buttons -->
            <div class="flex flex-col-reverse md:flex-row justify-between items-center gap-4 mt-10">

                    Confirm &amp; Continue

            <div class="text-headline-md font-headline-md text-on-surface">SAHAYAK</div>
            <a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200"
